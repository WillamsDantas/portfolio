<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willams Dantas | Design para infoprodutores</title>
<meta name="description" content="Design estratégico para infoprodutores que querem vender mais. Solicite um orçamento pelo WhatsApp ou volte para o Instagram.">
<meta name="theme-color" content="#0e0e0e">
<meta property="og:type" content="website">
<meta property="og:title" content="Willams Dantas | Design para infoprodutores">
<meta property="og:description" content="Design estratégico para infoprodutores que querem vender mais.">
<meta property="og:url" content="https://willamsdantas.com.br/links/">
<meta property="og:image" content="https://willamsdantas.com.br/links/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="canonical" href="https://willamsdantas.com.br/links/">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/host-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fontes: substitutas gratuitas de Resist Sans Display (títulos) e Articulat CF (textos).
   Para trocar pelas originais, basta apontar estes quatro arquivos para os woff2 licenciados. */
@font-face{font-family:"Titulo";src:url("fonts/host-grotesk-600.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Texto";src:url("fonts/hanken-grotesk-300.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Texto";src:url("fonts/hanken-grotesk-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Texto";src:url("fonts/hanken-grotesk-700.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  --fundo:#0e0e0e;
  --fundo-celular:#232323;
  --cartao:#141414;
  --cartao-borda:rgba(255,255,255,.16);
  --cartao-inativo:#2f2d2d;
  --cartao-inativo-borda:#6f6f6f;
  --inativo-texto:#969393;
  --inativo-botao:#4e4d4d;
  --destaque:#eaea4a;
  --texto:#f0eeee;
  --texto-botao:#1f1e1e;
  --cinza-1:#404040;
  /* 1 unidade = 1 px do quadro de celular (440 px de largura) */
  --u:calc(min(100vw, 560px) / 440);
  /* escala interna dos cartões em relação ao cartão de 250 px de altura */
  --c:calc(var(--u) * .62907);
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--fundo-celular);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;color:var(--texto);font-family:"Texto",system-ui,sans-serif;font-weight:300;overflow-x:hidden}
img{display:block}
h1,h2,p{margin:0}
a{color:inherit;text-decoration:none}

.cenario{display:none}
.palco{position:relative;isolation:isolate;width:calc(440 * var(--u));margin:0 auto;padding-bottom:calc(8 * var(--u))}

/* ---------- Perfil ---------- */
.perfil{position:relative;height:calc(333 * var(--u));overflow:hidden}
.perfil__fundo{position:absolute;left:0;top:0;width:calc(440.3 * var(--u));height:auto;max-width:none}
.perfil__retrato{position:absolute;left:calc(102 * var(--u));top:calc(27 * var(--u));width:calc(264.02 * var(--u));height:calc(408.57 * var(--u));overflow:hidden}
.perfil__retrato img{position:absolute;left:-47%;top:-8.25%;width:183.7%;height:177.35%;max-width:none}
.selo{position:absolute}
.selo img{position:absolute;inset:0;width:100%;height:100%}
.selo--elementor{left:calc(91.2 * var(--u));top:calc(115 * var(--u));width:calc(59.94 * var(--u));height:calc(60 * var(--u))}
.selo--photoshop{left:calc(79.3 * var(--u));top:calc(189.74 * var(--u));width:calc(73.17 * var(--u));height:calc(73.43 * var(--u))}
.selo--photoshop img{inset:-1.1% -3.12% -5.11% -3.12%;width:106.24%;height:106.21%}
.selo--figma{left:calc(295.7 * var(--u));top:calc(177.57 * var(--u));width:calc(94.2 * var(--u));height:calc(94.15 * var(--u))}
.selo--figma img{inset:0 0 -1.05% 0;height:101.05%}
.perfil__sombra{display:none}

.faixa{position:absolute;left:0;right:0;bottom:0;height:calc(34.6 * var(--u));border-top:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(calc(4.4 * var(--u)));backdrop-filter:blur(calc(4.4 * var(--u)));background:rgba(20,20,22,.28)}
.nome{position:absolute;left:0;right:0;top:50%;translate:0 -50%;display:flex;justify-content:center;align-items:center;gap:calc(10.3 * var(--u));white-space:nowrap;line-height:1.1}
.nome__lado{font-size:max(9.8px, calc(9.83 * var(--u)))}
.nome h1{font-size:calc(15.73 * var(--u));font-weight:700;padding:0 calc(10.3 * var(--u));
  border-left:1px solid var(--texto);border-right:1px solid var(--texto)}
.marca{position:absolute;left:calc(52.5 * var(--u));top:calc(-241.2 * var(--u))}
.marca img{width:calc(38.5 * var(--u));height:calc(19.05 * var(--u))}
.marca p{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- Cartões ---------- */
.links{display:grid;gap:calc(15.1 * var(--u));padding:calc(32 * var(--u)) calc(15.4 * var(--u)) 0 calc(16.7 * var(--u))}
.cartao{position:relative;display:block;height:calc(250 * var(--c));overflow:hidden;border-radius:calc(16 * var(--c));
  background:var(--cartao);border:1px solid var(--cartao-borda);transition:border-color .25s, background-color .25s}
.cartao__titulo{position:absolute;left:calc(48 * var(--c));top:calc(var(--topo, 50) * var(--c));width:calc(var(--larg, 230) * var(--c));
  font-family:"Titulo",system-ui,sans-serif;font-weight:500;font-size:calc(40 * var(--c));line-height:1.1;
  text-box:trim-both cap alphabetic;
  background:linear-gradient(141deg,#fff 26.14%,#d4d4d4 91.87%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.3em}
@supports not (text-box:trim-both cap alphabetic){
  .cartao__titulo{margin-top:-.19em}
  .botao span{translate:0 .04em}
}
.botao{position:absolute;left:calc(49 * var(--c));top:calc((var(--topo, 50) + 104) * var(--c));width:calc(220 * var(--c));height:calc(44 * var(--c));
  display:flex;align-items:center;justify-content:center;gap:calc(16 * var(--c));border-radius:calc(4 * var(--c));
  background:var(--destaque);color:var(--texto-botao);
  font-family:"Titulo",system-ui,sans-serif;font-weight:500;font-size:max(10px, calc(16 * var(--c)));line-height:1.2;letter-spacing:.06em;white-space:nowrap;
  transition:background-color .25s}
.botao span{text-box:trim-both cap alphabetic}
.botao img{width:calc(12 * var(--c));height:calc(12 * var(--c));transition:translate .25s}
.cartao__icone{position:absolute;right:calc(var(--dir) * var(--c));top:50%;translate:0 -50%;width:calc(var(--w) * var(--c));height:calc(var(--h) * var(--c));transition:translate .35s, scale .35s}

.cartao--whatsapp{--topo:50;--larg:230}
.cartao--whatsapp .cartao__icone{--w:137.59;--h:140;--dir:50.4;top:calc(111 * var(--c))}
.cartao--behance{--topo:49.5;--larg:260;background:var(--cartao-inativo);border:1.5px solid var(--cartao-inativo-borda)}
.cartao--behance .cartao__titulo{background:none;color:var(--inativo-texto)}
.cartao--behance .botao{background:var(--inativo-botao);color:var(--inativo-texto)}
.cartao--behance .cartao__icone{--w:135.7;--h:89.53;--dir:59.3}
.cartao--instagram{--topo:56;--larg:236}
.cartao--instagram .cartao__titulo,.cartao--instagram .botao{left:calc(47 * var(--c))}
.cartao--instagram .botao{color:var(--cinza-1)}
.cartao--instagram .cartao__icone{--w:160;--h:160;--dir:36;top:calc(124 * var(--c))}

.cartao:focus-visible{outline:2px solid var(--destaque);outline-offset:3px}
@media (hover:hover) and (pointer:fine){
  a.cartao:hover{border-color:rgba(255,255,255,.42);background:#181818}
  a.cartao:hover .botao{background:#f3f35f}
  a.cartao:hover .botao img{translate:2px -2px}
  a.cartao:hover .cartao__icone{scale:1.04}
}

.rodape{padding:calc(41 * var(--u)) calc(16 * var(--u)) 0;text-align:center;font-size:max(11px, calc(12.5 * var(--u)));color:#9b9b9b;line-height:1.4}

/* ---------- Entrada e movimento ---------- */
@keyframes entrar{from{opacity:0;translate:0 14px}}
@keyframes flutuar{50%{translate:0 calc(-5 * var(--u))}}
@media (prefers-reduced-motion:no-preference){
  .perfil{animation:entrar .8s cubic-bezier(.2,.7,.2,1) both}
  .cartao{animation:entrar .7s cubic-bezier(.2,.7,.2,1) both}
  .cartao--whatsapp{animation-delay:.18s}
  .cartao--behance{animation-delay:.28s}
  .cartao--instagram{animation-delay:.38s}
  .selo{animation:flutuar 6s ease-in-out infinite}
  .selo--photoshop{animation-duration:7.5s;animation-delay:-2s}
  .selo--figma{animation-duration:8.5s;animation-delay:-4s}
}

/* ---------- Computador: quadro de 1920 x 1063 que escala com a tela ---------- */
@media (min-width:1100px) and (min-aspect-ratio:5/4){
  :root{--u:min(calc(100vw / 1920), calc(100svh / 1063));--c:var(--u)}
  html{background:radial-gradient(110% 100% at 92% -8%, rgba(255,255,255,.09), transparent 64%), var(--fundo)}
  body{display:grid;place-items:center;overflow:hidden}
  .cenario{display:block;position:fixed;z-index:-1;inset:0;overflow:hidden;pointer-events:none;
    background-image:radial-gradient(circle, rgba(255,255,255,.1) calc(2.48 * var(--u)), transparent calc(2.9 * var(--u)));
    background-size:calc(54.42 * var(--u)) calc(54.66 * var(--u));
    background-position:calc(50% + 19.06 * var(--u)) calc(50% - 25.06 * var(--u))}
  .cenario img{position:absolute;left:50%;top:50%;height:auto;opacity:.28;filter:blur(calc(11 * var(--u)))}
  .cenario__ps{width:calc(328 * var(--u));margin:calc(-468 * var(--u)) 0 0 calc(-924 * var(--u))}
  .cenario__figma{width:calc(385 * var(--u));margin:calc(-100 * var(--u)) 0 0 calc(588 * var(--u))}
  .cenario__elementor{width:calc(300 * var(--u));margin:calc(165 * var(--u)) 0 0 calc(-920 * var(--u))}

  .palco{width:calc(1920 * var(--u));height:calc(1063 * var(--u));margin:0;padding:0}
  .perfil{position:absolute;left:calc(280 * var(--u));top:0;width:calc(714 * var(--u));height:calc(1063 * var(--u));background:#131313}
  .perfil__fundo{left:calc(-109.7 * var(--u));top:calc(-33.6 * var(--u));width:calc(895.5 * var(--u))}
  .perfil__retrato{left:calc(19 * var(--u));top:calc(78 * var(--u));width:calc(664 * var(--u));height:calc(985 * var(--u))}
  .perfil__retrato img{left:-27.41%;top:-7.01%;width:150.75%;height:151.63%}
  .selo--elementor{left:calc(76 * var(--u));top:calc(243 * var(--u));width:calc(121.9 * var(--u));height:calc(122.05 * var(--u))}
  .selo--photoshop{left:calc(36 * var(--u));top:calc(395 * var(--u));width:calc(148.82 * var(--u));height:calc(149.34 * var(--u))}
  .selo--figma{left:calc(492 * var(--u));top:calc(333 * var(--u));width:calc(191.6 * var(--u));height:calc(191.49 * var(--u))}
  .perfil__sombra{display:block;position:absolute;left:0;top:calc(18 * var(--u));width:100%;height:calc(1050 * var(--u));
    background:linear-gradient(180deg, rgba(13,13,14,0) 40.37%, rgba(14,14,14,.72) 72.07%, rgb(14,14,14) 100%)}

  .faixa{height:calc(337 * var(--u));background:none;-webkit-backdrop-filter:blur(calc(9 * var(--u)));backdrop-filter:blur(calc(9 * var(--u)))}
  .nome{top:calc(55 * var(--u));left:calc(-12 * var(--u));gap:calc(21 * var(--u))}
  .nome__lado{font-size:calc(20 * var(--u))}
  .nome h1{font-size:calc(32 * var(--u));padding:0 calc(21 * var(--u))}
  .marca{left:0;right:0;top:calc(126 * var(--u));display:flex;justify-content:center;align-items:center;gap:calc(40 * var(--u))}
  .marca img{width:calc(160 * var(--u));height:calc(79.18 * var(--u))}
  .marca p{position:static;width:calc(334 * var(--u));height:auto;overflow:visible;clip-path:none;white-space:normal;
    font-size:calc(20 * var(--u));line-height:1.42;letter-spacing:.17em}
  .marca strong{font-weight:600}

  .links{position:absolute;left:calc(1044 * var(--u));top:calc(101 * var(--u));width:calc(596 * var(--u));gap:calc(56 * var(--u));padding:0}
  .botao{font-size:calc(16 * var(--c))}
  .rodape{display:none}
}
</style>
</head>
<body>


<main class="palco">
  <div class="cenario" aria-hidden="true">
    <img class="cenario__ps" src="img/icone-photoshop.svg" alt="" width="158" height="159">
    <img class="cenario__figma" src="img/icone-figma.svg" alt="" width="192" height="194">
    <img class="cenario__elementor" src="img/icone-elementor.svg" alt="" width="122" height="122">
  </div>
  <header class="perfil">
    <img class="perfil__fundo" src="img/fundo.webp" alt="" width="916" height="1122">
    <div class="perfil__retrato"><img src="img/retrato.webp" alt="Willams Dantas, designer, de camiseta preta e braços cruzados" width="686" height="1024"></div>
    <div class="selo selo--elementor" aria-hidden="true"><img src="img/icone-elementor.svg" alt="" width="122" height="122"></div>
    <div class="selo selo--photoshop" aria-hidden="true"><img src="img/icone-photoshop.svg" alt="" width="158" height="159"></div>
    <div class="selo selo--figma" aria-hidden="true"><img src="img/icone-figma.svg" alt="" width="192" height="194"></div>
    <div class="perfil__sombra"></div>
    <div class="faixa">
      <div class="nome">
        <span class="nome__lado">Infoprodutos</span>
        <h1>Willams Dantas</h1>
        <span class="nome__lado">Lançamentos</span>
      </div>
      <div class="marca">
        <img src="img/logo.svg" alt="Dantas dsgn." width="160" height="79">
        <p>Criando <strong>design estratégico</strong> para infoprodutores que querem vender mais.</p>
      </div>
    </div>
  </header>

  <nav class="links" aria-label="Links principais">
    <a class="cartao cartao--whatsapp" href="https://wa.me/5582996463391?text=Ol%C3%A1%2C%20Willams!%20Quero%20solicitar%20um%20or%C3%A7amento.">
      <h2 class="cartao__titulo">Solicite um Orçamento</h2>
      <span class="botao"><span>SOLICITAR AGORA</span><img src="img/seta.svg" alt="" width="12" height="12"></span>
      <img class="cartao__icone" src="img/whatsapp.svg" alt="" width="138" height="140">
    </a>
    <div class="cartao cartao--behance" aria-disabled="true">
      <h2 class="cartao__titulo">Conheça meu Portfólio</h2>
      <span class="botao"><span>VER BEHANCE</span><img src="img/seta-inativa.svg" alt="" width="12" height="12"></span>
      <img class="cartao__icone" src="img/behance.svg" alt="" width="136" height="90">
    </div>
    <a class="cartao cartao--instagram" href="https://www.instagram.com/willamsdanttas/">
      <h2 class="cartao__titulo">Voltar para o Instagram</h2>
      <span class="botao"><span>VOLTAR AGORA</span><img src="img/seta.svg" alt="" width="12" height="12"></span>
      <img class="cartao__icone" src="img/instagram.svg" alt="" width="160" height="160">
    </a>
  </nav>

  <footer class="rodape">© Copyright 2025 | Willams Dantas. Todos os direitos reservados.</footer>
</main>

</body>
</html>
